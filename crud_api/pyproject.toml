[project]
name = "crud-api"
version = "0.1.0"
description = "API REST du parc informatique (FastAPI, SQLAlchemy, PostgreSQL)"
readme = "README.md"
authors = [
    { name = "cybern0", email = "tnyanjaramihaja@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "argon2-cffi>=23.1.0",
    "asyncpg>=0.32.0",
    "email-validator>=2.1.0",
    "fastapi>=0.156.4",
    "pydantic-settings>=2.4.0",
    "pyjwt>=2.8.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
crud-api = "crud_api:main"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
